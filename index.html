
!<DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Planner</title>
     <link rel="stylesheet" href="./css/style.css" />
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    Routine
  </header>
<div class="container mt-4">
    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">
            Tuesday Daily Routine
        </div>

        <ul id="taskList" class="list-group">

            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                    <span class="task-text">6:00 AM - Wake up</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
         <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                   <span class="task-text">7:00AM - Study Session(4hrs)</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
             <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                    <span class="task-text">11 AM -  Breakfast</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
             <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                    <span class="task-text">12:00 AM - House choir</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
             <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                   <span class="task-text">1:00 PM - Lunch</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
             <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                   <span class="task-text">2:00 AM - GYM(3hrs)</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
             <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                    <span class="task-text">5:00 PM - Bath & Preparation to dinner(4hrs)</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
             <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <input type="checkbox" class="form-check-input me-2">
                    <span class="task-text">10:00 PM - Personal Time</span>
                </div>
                <div>
                    <button class="btn btn-sm btn-warning editBtn">Edit</button>
                    <button class="btn btn-sm btn-danger deleteBtn">Delete</button>
                </div>
            </li>
        </ul>

        <div class="p-3">
            <input type="text" id="newTask" class="form-control mb-2" placeholder="Enter new task">
            <button id="addtask" class="btn btn-success w-100">Add Task</button>
        </div>

    </div>
</div>

<script src="./js/index.js"></script>



</body>
</html>
